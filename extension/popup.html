<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>body { width: 340px; padding: 14px; }</style>
</head>
<body>
  <h1>New link</h1>
  <form id="form">
    <div id="backend-row" hidden>
      <label for="backend">Server</label>
      <select id="backend"></select>
    </div>
    <label for="slug">Name</label>
    <div class="slug"><span id="prefix"></span><input id="slug" type="text" required maxlength="64" autocomplete="off" spellcheck="false" autofocus></div>
    <label for="url">Destination URL</label>
    <input id="url" type="text" required maxlength="2048" spellcheck="false">
    <label for="desc">Description (optional)</label>
    <input id="desc" type="text" maxlength="500">
    <div class="row">
      <button id="submit" type="submit">Create link</button>
      <a id="browse" href="#">All links</a>
    </div>
  </form>
  <p class="msg" id="msg" role="status"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>

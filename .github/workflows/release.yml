name: Release
# Publishing a GitHub release builds the extension for each browser and attaches the packages
# to that release. Store submission (Chrome Web Store, Edge Add-ons, Firefox Add-ons) stays manual.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      # extension/manifest.json holds the version; the tag must agree (v1.2.3 for 1.2.3).
      - name: Tag matches the extension version
        id: version
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$v" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match extension/manifest.json version $v. Bump the manifest or retag."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test -w extension
      - run: npm run build -w extension
      - run: npm run lint -w extension
      # Both stores want manifest.json at the root of the zip. Edge takes the Chrome package.
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd extension/dist/chrome && zip -qr "$GITHUB_WORKSPACE/cairn-extension-$VERSION-chrome-edge.zip" .)
          (cd extension/dist/firefox && zip -qr "$GITHUB_WORKSPACE/cairn-extension-$VERSION-firefox.zip" .)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" cairn-extension-*.zip --clobber

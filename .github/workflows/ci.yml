name: CI
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      # Every story in ui/src runs as a test in Chromium (vitest.config.ts).
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      # Firefox's add-on validator, so a problem shows up here rather than at release time.
      - run: npm run lint -w extension
      - run: npm run build-storybook
      # The Deploy to Cloudflare button copies only server/, so it deploys the committed build.
      - name: Committed server UI build is up to date
        run: |
          if [ -n "$(git status --porcelain -- server/public)" ]; then
            git status --short -- server/public
            echo "::error::server/public/_/ is out of date. Run 'npm run build' at the root and commit it."
            exit 1
          fi
      # Hand Storybook to GitHub Pages from main, once everything above has
      # passed; the storybook job deploys it.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: storybook-static
  storybook:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One deploy at a time; a newer push waits rather than cancelling one already going out.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      # The server's tests run against the built web UI, which needs the root's tools.
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server
